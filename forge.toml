[package]
name = "cube_forge"
version = "0.1.0"
type = "app"
description = "Minimal voxel renderer — a March dogfooding exercise"
author = ""
license = ""

[deps]

# The C shim: window/GL-surface/draw calls + input polling. One package, one
# auditable unsafe surface. Two extern blocks on the March side split it into
# the Window and Input capability domains.
[ffi]
sources = ["native/cf_shim.c", "native/glad/gl.c", "native/cf_audio.c"]
# forge has no separate cflags/include field; the shim sources are compiled on
# the same clang line as the link, so -I flags ride along in `link`.
link = ["-Inative", "-I/opt/homebrew/include", "-L/opt/homebrew/lib", "-lglfw"]
